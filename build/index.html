<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayMyChord Studio</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <div class="container">
      <header class="header">
        <h1>🎵 PlayMyChord</h1>
        <nav class="nav">
          <button class="nav-btn active" data-tab="generate">⚡ Gerar</button>
          <button class="nav-btn" data-tab="custom">🎛️ Custom</button>
          <button class="nav-btn" data-tab="lyrics">📝 Letras</button>
          <button class="nav-btn" data-tab="library">🎵 Biblioteca</button>
          <button class="nav-btn" data-tab="config">⚙️ Config</button>
        </nav>
      </header>

      <main class="main-content">
        <!-- TAB: Gerar Música -->
        <section id="generate" class="tab-content active">
          <h2>Gerar Música</h2>
          <div class="form-group">
            <label for="prompt">Descrição da Música:</label>
            <textarea id="prompt" placeholder="Ex: Uma música alegre em estilo pop..."></textarea>
          </div>
          <div class="form-group">
            <label for="style">Estilo:</label>
            <input type="text" id="style" placeholder="Ex: pop, rock, jazz...">
          </div>
          <div class="form-group">
            <label for="genre">Gênero:</label>
            <input type="text" id="genre" placeholder="Ex: gospel, trap, lo-fi...">
          </div>
          <div class="form-group">
            <label>
              <input type="checkbox" id="instrumental"> Instrumental
            </label>
          </div>
          <button id="generateBtn" class="btn btn-primary">Gerar Música</button>
          <div id="generateStatus" class="status"></div>
        </section>

        <!-- TAB: Custom -->
        <section id="custom" class="tab-content">
          <h2>Gerar Música Custom</h2>
          <div class="form-group">
            <label for="customPrompt">Prompt Customizado:</label>
            <textarea id="customPrompt" placeholder="Descreva a música em detalhes..."></textarea>
          </div>
          <button id="customBtn" class="btn btn-primary">Gerar</button>
          <div id="customStatus" class="status"></div>
        </section>

        <!-- TAB: Letras -->
        <section id="lyrics" class="tab-content">
          <h2>Gerar Letras</h2>
          <div class="form-group">
            <label for="lyricsPrompt">Tema das Letras:</label>
            <textarea id="lyricsPrompt" placeholder="Qual é o tema da música?"></textarea>
          </div>
          <button id="lyricsBtn" class="btn btn-primary">Gerar Letras</button>
          <div id="lyricsStatus" class="status"></div>
          <div id="lyricsResult" class="result"></div>
        </section>

        <!-- TAB: Biblioteca -->
        <section id="library" class="tab-content">
          <h2>Biblioteca</h2>
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar músicas...">
          </div>
          <div id="libraryList" class="library-list"></div>
        </section>

        <!-- TAB: Configurações -->
        <section id="config" class="tab-content">
          <h2>Configurações</h2>
          <div class="config-section">
            <h3>Chave do Sonauto:</h3>
            <textarea id="sonautoKey" placeholder="Cole sua chave do Sonauto aqui..."></textarea>
            <button id="saveSonautoKeyBtn" class="btn btn-secondary">Salvar Chave</button>
            <button id="testSonautoKeyBtn" class="btn btn-secondary">Testar Chave</button>
          </div>
          <div id="creditsInfo" class="credits-info">
            <h3>Informações de Créditos</h3>
            <p id="creditsText">Carregando...</p>
            <button id="refreshCreditsBtn" class="btn btn-secondary">Ver Créditos</button>
          </div>
        </section>
      </main>

      <aside class="sidebar">
        <div class="player">
          <h3>🎵 Player</h3>
          <p id="nowPlaying">Nenhuma música em reprodução</p>
          <audio id="audioPlayer" controls></audio>
        </div>
      </aside>
    </div>

    <footer class="footer">
      <div class="footer-nav">
        <button class="footer-btn active" data-tab="generate">⚡</button>
        <button class="footer-btn" data-tab="custom">🎛️</button>
        <button class="footer-btn" data-tab="lyrics">📝</button>
        <button class="footer-btn" data-tab="library">🎵</button>
        <button class="footer-btn" data-tab="config">⚙️</button>
      </div>
    </footer>
  </div>

  <script src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/service-worker.js')
          .then(function(registration) {
            console.log('[PWA] Service Worker registrado:', registration.scope);
          })
          .catch(function(error) {
            console.log('[PWA] Falha ao registrar:', error);
          });
      });
    }
  </script>
</body>
</html>
